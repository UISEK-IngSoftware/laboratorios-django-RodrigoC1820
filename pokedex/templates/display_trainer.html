{% extends "base.html" %}

{% block title %}
{{ trainer|capfirst }}
{% endblock title %}

{% block content %}

<h1 class="text-secondary mt-3">
    {{ trainer|capfirst }}
</h1>

<hr style="border: 2px solid #17a2b8; width: 70%; margin-left: 0;">

<div class="card shadow p-4 mt-4"
     style="max-width: 700px; border-radius: 15px;">

    <h3 class="mb-4">
        <i class="fa-solid fa-user"></i>
        Detalles del entrenador
    </h3>

    <ul class="list-group list-group-flush">

        <li class="list-group-item">
            <strong>
                <i class="fa-solid fa-ranking-star text-warning"></i>
                Nivel:
            </strong>

            {{ trainer.level }}
        </li>

        <li class="list-group-item">
            <strong>
                <i class="fa-solid fa-calendar-days text-primary"></i>
                Fecha de nacimiento:
            </strong>

            {{ trainer.birth_date }}
        </li>

    </ul>

    <div class="mt-4">

        <a href="{% url 'index' %}"
           class="btn btn-info btn-lg shadow">

            <i class="fa-solid fa-arrow-left"></i>
            Regresar

        </a>

    </div>

</div>

<style>

    .btn-info{
        transition: 0.3s;
        border-radius: 12px;
        padding: 10px 25px;
        font-weight: bold;
    }

    .btn-info:hover{
        transform: scale(1.08);
        box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
    }

</style>

{% endblock content %}
